<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Approval Status Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- KEEP ALL YOUR CSS EXACTLY AS YOU HAVE IT -->
  <style>
    /* (UNCHANGED — your full CSS stays here exactly as-is) */
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-left">
    <h1>Approval Dashboard</h1>
  </div>
  <div class="ts">Updated <span id="ts">—</span></div>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('board')">Board</button>
  <button class="tab-btn" onclick="switchTab('entry')">New Entry</button>
</nav>

<!-- ENTRY -->
<div class="panel" id="panel-entry">
  <div class="entry-wrap">
    <h2>Submit Invoice</h2>

    <input id="f-name" placeholder="Invoice Name" />
    <input id="f-num" placeholder="Invoice Number" />
    <input id="f-amt" type="number" placeholder="Amount" />

    <button onclick="submitEntry()">Post Invoice</button>
  </div>
</div>

<!-- BOARD -->
<div class="panel active" id="panel-board">
  <div class="board-wrap">

    <div class="summary">
      <div>Pending: <span id="cnt-pending">0</span></div>
      <div>Approved: <span id="cnt-approved">0</span></div>
      <div>Rejected: <span id="cnt-rejected">0</span></div>
      <div>Total: <span id="sum-total">0</span></div>
    </div>

    <div class="board">

      <div class="column">
        <h3>Pending</h3>
        <div id="cards-pending"></div>
      </div>

      <div class="column">
        <h3>Approved</h3>
        <div id="cards-approved"></div>
      </div>

      <div class="column">
        <h3>Rejected</h3>
        <div id="cards-rejected"></div>
      </div>

    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://pbjdlqekdjwwzzqsqwur.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_ANON_KEY_HERE";

function switchTab(tab) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-" + tab).classList.add("active");
}

/* =======================
   LOAD DATA FROM SUPABASE
======================= */
async function loadInvoices() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/invoices?select=*`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  });

  const data = await res.json();
  render(data);
}

/* =======================
   RENDER UI
======================= */
function render(invoices) {
  const groups = { pending: [], approved: [], rejected: [] };

  invoices.forEach(inv => {
    if (!groups[inv.status]) groups[inv.status] = [];
    groups[inv.status].push(inv);
  });

  renderColumn("pending", groups.pending);
  renderColumn("approved", groups.approved);
  renderColumn("rejected", groups.rejected);

  document.getElementById("cnt-pending").textContent = groups.pending.length;
  document.getElementById("cnt-approved").textContent = groups.approved.length;
  document.getElementById("cnt-rejected").textContent = groups.rejected.length;
  document.getElementById("sum-total").textContent = invoices.length;

  document.getElementById("ts").textContent =
    new Date().toLocaleTimeString();
}

/* =======================
   RENDER COLUMN
======================= */
function renderColumn(status, items) {
  const el = document.getElementById("cards-" + status);

  if (!items.length) {
    el.innerHTML = "<p style='opacity:0.5'>Empty</p>";
    return;
  }

  el.innerHTML = items.map(inv => `
    <div style="border:1px solid #333; padding:10px; margin:5px;">
      <b>${inv.name}</b><br/>
      ${inv.num}<br/>
      €${inv.amount}<br/>

      <button onclick="updateStatus(${inv.id}, 'approved')">Approve</button>
      <button onclick="updateStatus(${inv.id}, 'rejected')">Reject</button>
      <button onclick="updateStatus(${inv.id}, 'pending')">Move</button>
    </div>
  `).join("");
}

/* =======================
   ADD INVOICE (REAL)
======================= */
async function submitEntry() {
  const name = document.getElementById("f-name").value;
  const num = document.getElementById("f-num").value;
  const amount = document.getElementById("f-amt").value;

  if (!name || !num || !amount) return;

  await fetch(`${SUPABASE_URL}/rest/v1/invoices`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name,
      num,
      amount: parseFloat(amount),
      status: "pending"
    })
  });

  loadInvoices();
}

/* =======================
   UPDATE STATUS (REAL)
======================= */
async function updateStatus(id, status) {
  await fetch(`${SUPABASE_URL}/rest/v1/invoices?id=eq.${id}`, {
    method: "PATCH",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ status })
  });

  loadInvoices();
}

loadInvoices();
</script>

</body>
</html>
