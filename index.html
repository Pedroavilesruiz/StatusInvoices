<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Approval Status Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #0c0c0e;
      --surface:       #141416;
      --surface-2:     #1a1a1e;
      --border:        #262630;
      --border-soft:   #1e1e26;
      --text-primary:  #eeeef5;
      --text-secondary:#8080a0;
      --text-muted:    #50506a;
      --accent:        #c8f04d;
      --accent-dim:    rgba(200,240,77,0.12);
      --pending-c:  #f5a623; --pending-bg:  rgba(245,166,35,0.10);  --pending-br:  rgba(245,166,35,0.22);
      --approved-c: #4dffa0; --approved-bg: rgba(77,255,160,0.10);  --approved-br: rgba(77,255,160,0.22);
      --rejected-c: #ff5c7a; --rejected-bg: rgba(255,92,122,0.10);  --rejected-br: rgba(255,92,122,0.22);
      --r: 10px; --rs: 6px;
    }

    body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

    /* TOP BAR */
    .topbar {
      position: sticky; top: 0; z-index: 200;
      background: rgba(12,12,14,0.9); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      height: 60px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.75rem; gap: 1rem;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .logo { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
    .logo svg { width: 15px; height: 15px; }
    .topbar h1 { font-size: 0.97rem; font-weight: 700; }
    .ts { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text-muted); }
    .ts span { color: var(--text-secondary); }

    /* TABS */
    .tab-nav {
      display: flex; align-items: center; gap: 2px;
      padding: 0 1.75rem; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab-btn {
      position: relative; background: none; border: none; cursor: pointer;
      font-family: 'Syne', sans-serif; font-size: 0.8rem; font-weight: 700;
      color: var(--text-muted); padding: 14px 16px 12px;
      letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.15s;
    }
    .tab-btn::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
      background: var(--accent); border-radius: 2px 2px 0 0;
      transform: scaleX(0); transition: transform 0.2s;
    }
    .tab-btn.active { color: var(--accent); }
    .tab-btn.active::after { transform: scaleX(1); }
    .tab-btn:hover:not(.active) { color: var(--text-secondary); }
    .notif {
      display: inline-flex; align-items: center; justify-content: center;
      width: 17px; height: 17px; border-radius: 50%;
      background: var(--pending-bg); color: var(--pending-c);
      font-size: 0.6rem; font-weight: 700; margin-left: 5px;
      border: 1px solid var(--pending-br); font-family: 'DM Mono', monospace;
    }

    /* PANELS */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ENTRY PANEL */
    .entry-wrap { max-width: 540px; margin: 3rem auto; padding: 0 1.5rem; }
    .entry-heading { margin-bottom: 2rem; }
    .entry-heading h2 { font-size: 1.55rem; font-weight: 800; margin-bottom: 6px; }
    .entry-heading p { color: var(--text-secondary); font-size: 0.87rem; line-height: 1.6; }
    .entry-heading strong { color: var(--accent); }

    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.75rem; }
    .field { margin-bottom: 1.2rem; }
    .field:last-of-type { margin-bottom: 0; }
    .field label {
      display: block; font-size: 0.73rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-secondary); margin-bottom: 7px;
    }
    .field label span { color: var(--rejected-c); margin-left: 2px; }
    .field input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text-primary); font-family: 'DM Mono', monospace; font-size: 0.87rem;
      padding: 11px 14px; border-radius: var(--rs); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s; -webkit-appearance: none;
    }
    .field input::placeholder { color: var(--text-muted); }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .field input.error { border-color: var(--rejected-c); }
    .amount-wrap { position: relative; }
    .amount-wrap .curr { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: 'DM Mono', monospace; font-size: 0.87rem; color: var(--text-muted); pointer-events: none; }
    .amount-wrap input { padding-left: 26px; }

    .form-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; gap: 1rem; }
    .form-hint { font-size: 0.74rem; color: var(--text-muted); }
    .form-hint strong { color: var(--pending-c); }

    .submit-btn {
      display: flex; align-items: center; gap: 7px;
      background: var(--accent); color: #0c0c0e; border: none; border-radius: var(--rs);
      font-family: 'Syne', sans-serif; font-size: 0.83rem; font-weight: 700;
      padding: 11px 20px; cursor: pointer; white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
    }
    .submit-btn:hover { opacity: 0.85; }
    .submit-btn:active { transform: scale(0.97); }
    .submit-btn svg { width: 13px; height: 13px; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface-2); border: 1px solid var(--approved-br);
      color: var(--approved-c); font-size: 0.82rem; font-weight: 600;
      padding: 10px 20px; border-radius: 100px;
      display: flex; align-items: center; gap: 8px;
      z-index: 500; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
      opacity: 0; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast svg { width: 13px; height: 13px; }

    /* BOARD PANEL */
    .board-wrap { padding: 1.75rem; max-width: 1400px; margin: 0 auto; }
    .summary { display: flex; gap: 10px; margin-bottom: 1.75rem; flex-wrap: wrap; }
    .chip { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 5px 13px; font-size: 0.78rem; font-weight: 700; }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; }
    .chip .num { font-family: 'DM Mono', monospace; color: var(--text-secondary); }

    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; align-items: start; }
    .column { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--r); overflow: hidden; }
    .col-header { padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-soft); }
    .col-header-left { display: flex; align-items: center; gap: 9px; }
    .col-stripe { width: 4px; height: 20px; border-radius: 2px; }
    .col-title { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
    .col-count { font-family: 'DM Mono', monospace; font-size: 0.72rem; padding: 3px 9px; border-radius: 100px; font-weight: 500; }
    .col-cards { padding: 12px; display: flex; flex-direction: column; gap: 9px; min-height: 80px; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; gap: 7px; color: var(--text-muted); font-size: 0.77rem; text-align: center; }
    .empty-state svg { width: 22px; height: 22px; opacity: 0.25; }

    /* CARD */
    .card {
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--rs);
      padding: 13px 14px; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      animation: fadeUp 0.28s ease both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 9px; }
    .inv-name { font-size: 0.85rem; font-weight: 700; line-height: 1.3; }
    .inv-num { font-family: 'DM Mono', monospace; font-size: 0.67rem; color: var(--text-muted); margin-top: 2px; }

    .badge { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
    .badge-pending  { background: var(--pending-bg);  color: var(--pending-c);  border: 1px solid var(--pending-br); }
    .badge-approved { background: var(--approved-bg); color: var(--approved-c); border: 1px solid var(--approved-br); }
    .badge-rejected { background: var(--rejected-bg); color: var(--rejected-c); border: 1px solid var(--rejected-br); }

    .card-div { height: 1px; background: var(--border-soft); margin: 9px 0; }
    .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .req { display: flex; align-items: center; gap: 7px; }
    .av { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; color: #0c0c0e; flex-shrink: 0; }
    .req-name { font-size: 0.76rem; color: var(--text-secondary); font-weight: 500; }
    .amt { font-family: 'DM Mono', monospace; font-size: 0.85rem; font-weight: 500; }

    .card-actions { display: flex; gap: 6px; }
    .action-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
      border: none; border-radius: var(--rs); cursor: pointer;
      font-family: 'Syne', sans-serif; font-size: 0.72rem; font-weight: 700;
      padding: 7px 10px; transition: opacity 0.15s, transform 0.1s; letter-spacing: 0.03em;
    }
    .action-btn:hover { opacity: 0.78; }
    .action-btn:active { transform: scale(0.96); }
    .action-btn svg { width: 11px; height: 11px; flex-shrink: 0; }
    .btn-approve { background: var(--approved-bg); color: var(--approved-c); border: 1px solid var(--approved-br); }
    .btn-reject  { background: var(--rejected-bg);  color: var(--rejected-c);  border: 1px solid var(--rejected-br); }
    .btn-undo    { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); }

    /* column themes */
    .col-pending  .col-stripe { background: var(--pending-c); }
    .col-pending  .col-title  { color: var(--pending-c); }
    .col-pending  .col-count  { background: var(--pending-bg); color: var(--pending-c); }
    .col-pending  .card:hover { border-color: var(--pending-br); }
    .col-approved .col-stripe { background: var(--approved-c); }
    .col-approved .col-title  { color: var(--approved-c); }
    .col-approved .col-count  { background: var(--approved-bg); color: var(--approved-c); }
    .col-approved .card:hover { border-color: var(--approved-br); }
    .col-rejected .col-stripe { background: var(--rejected-c); }
    .col-rejected .col-title  { color: var(--rejected-c); }
    .col-rejected .col-count  { background: var(--rejected-bg); color: var(--rejected-c); }
    .col-rejected .card:hover { border-color: var(--rejected-br); }

    @media (max-width: 900px) {
      .board { grid-template-columns: 1fr 1fr; }
      .col-approved { grid-column: 1 / -1; }
    }
    @media (max-width: 580px) {
      .topbar { padding: 0 1rem; }
      .ts { display: none; }
      .board-wrap { padding: 1rem; }
      .board { grid-template-columns: 1fr; }
      .col-approved { grid-column: auto; }
      .entry-wrap { margin: 1.5rem auto; }
      .form-footer { flex-direction: column; align-items: stretch; }
      .submit-btn { justify-content: center; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <svg viewBox="0 0 16 16" fill="none">
        <path d="M2 4h12M2 8h8M2 12h5" stroke="#0c0c0e" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Approval Dashboard</h1>
  </div>
  <div class="ts">Updated &nbsp;<span id="ts">—</span></div>
</header>

<nav class="tab-nav">
  <button class="tab-btn" id="tab-entry" onclick="switchTab('entry')">
    ✦ New Entry
  </button>
  <button class="tab-btn active" id="tab-board" onclick="switchTab('board')">
    Board <span class="notif" id="pending-notif">0</span>
  </button>
</nav>

<!-- ENTRY PANEL -->
<div class="panel" id="panel-entry">
  <div class="entry-wrap">
    <div class="entry-heading">
      <h2>Submit an Invoice</h2>
      <p>Hey <strong>Veronica</strong> 👋 — fill in the details and hit Post. It'll land in the <strong>Pending</strong> queue for review.</p>
    </div>
    <div class="form-card">
      <div class="field">
        <label>Invoice Name <span>*</span></label>
        <input type="text" id="f-name" placeholder="e.g. Office Supplies Q4" autocomplete="off" />
      </div>
      <div class="field">
        <label>Invoice Number <span>*</span></label>
        <input type="text" id="f-num" placeholder="e.g. INV-2024-0110" autocomplete="off" />
      </div>
      <div class="field">
        <label>Amount <span>*</span></label>
        <div class="amount-wrap">
          <span class="curr">$</span>
          <input type="number" id="f-amt" placeholder="0.00" min="0" step="0.01" />
        </div>
      </div>
      <div class="form-footer">
        <span class="form-hint">Will be posted as <strong>Pending</strong></span>
        <button class="submit-btn" onclick="submitEntry()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Post Invoice
        </button>
      </div>
    </div>
  </div>
</div>

<!-- BOARD PANEL -->
<div class="panel active" id="panel-board">
  <div class="board-wrap">
    <div class="summary">
      <div class="chip"><div class="dot" style="background:var(--pending-c)"></div>Pending <span class="num" id="sum-pending">0</span></div>
      <div class="chip"><div class="dot" style="background:var(--approved-c)"></div>Approved <span class="num" id="sum-approved">0</span></div>
      <div class="chip"><div class="dot" style="background:var(--rejected-c)"></div>Rejected <span class="num" id="sum-rejected">0</span></div>
      <div class="chip" style="margin-left:auto"><div class="dot" style="background:var(--accent)"></div>Total <span class="num" id="sum-total">0</span></div>
    </div>
    <div class="board">
      <div class="column col-pending">
        <div class="col-header">
          <div class="col-header-left"><div class="col-stripe"></div><span class="col-title">Pending</span></div>
          <span class="col-count" id="cnt-pending">0</span>
        </div>
        <div class="col-cards" id="cards-pending"></div>
      </div>
      <div class="column col-approved">
        <div class="col-header">
          <div class="col-header-left"><div class="col-stripe"></div><span class="col-title">Approved</span></div>
          <span class="col-count" id="cnt-approved">0</span>
        </div>
        <div class="col-cards" id="cards-approved"></div>
      </div>
      <div class="column col-rejected">
        <div class="col-header">
          <div class="col-header-left"><div class="col-stripe"></div><span class="col-title">Rejected</span></div>
          <span class="col-count" id="cnt-rejected">0</span>
        </div>
        <div class="col-cards" id="cards-rejected"></div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-msg">Done!</span>
</div>

<script>
  let invoices = [];
  let idCounter = 1;

  const AVATAR_COLORS = ['#f5a623','#4dffa0','#ff5c7a','#4da8ff','#c47cf5','#c8f04d','#ff9f4d','#4dfff0'];
  function avatarColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initials(name) {
    return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtAmt(n) {
    return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function switchTab(tab) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
  }

  function submitEntry() {
    const nameEl = document.getElementById('f-name');
    const numEl  = document.getElementById('f-num');
    const amtEl  = document.getElementById('f-amt');

    const name = nameEl.value.trim();
    const num  = numEl.value.trim();
    const amt  = parseFloat(amtEl.value);

    let ok = true;
    nameEl.classList.toggle('error', !name);
    numEl.classList.toggle('error', !num);
    amtEl.classList.toggle('error', isNaN(amt) || amt < 0);
    if (!name || !num || isNaN(amt) || amt < 0) return;

    invoices.push({
      id: idCounter++,
      name, amt,
      num: num.startsWith('#') ? num : '#' + num,
      status: 'pending',
      requester: 'Veronica'
    });

    nameEl.value = ''; numEl.value = ''; amtEl.value = '';
    render();
    toast('Invoice posted to Pending!');
    switchTab('board');
    tick();
  }

  function changeStatus(id, s) {
    const inv = invoices.find(i => i.id === id);
    if (!inv) return;
    inv.status = s;
    render(); tick();
    const labels = { approved: 'Approved ✓', rejected: 'Rejected', pending: 'Moved to Pending' };
    toast(labels[s] || 'Updated');
  }

  function render() {
    const groups = { pending: [], approved: [], rejected: [] };
    invoices.forEach(inv => groups[inv.status].push(inv));

    Object.keys(groups).forEach(s => {
      renderCol(s, groups[s]);
      const n = groups[s].length;
      document.getElementById('cnt-' + s).textContent = n;
      document.getElementById('sum-' + s).textContent = n;
    });
    document.getElementById('sum-total').textContent = invoices.length;
    document.getElementById('pending-notif').textContent = groups.pending.length;
  }

  function renderCol(status, items) {
    const el = document.getElementById('cards-' + status);
    el.innerHTML = '';
    if (!items.length) {
      el.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h4"/></svg>
        Nothing here yet
      </div>`;
      return;
    }
    items.forEach(inv => {
      const card = document.createElement('div');
      card.className = 'card';
      const color = avatarColor(inv.requester);
      const ini   = initials(inv.requester);

      let actions = '';
      if (status === 'pending') {
        actions = `<div class="card-actions">
          <button class="action-btn btn-approve" onclick="changeStatus(${inv.id},'approved')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Approve
          </button>
          <button class="action-btn btn-reject" onclick="changeStatus(${inv.id},'rejected')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Reject
          </button>
        </div>`;
      } else {
        actions = `<div class="card-actions">
          <button class="action-btn btn-undo" onclick="changeStatus(${inv.id},'pending')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>Move to Pending
          </button>
        </div>`;
      }

      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="inv-name">${esc(inv.name)}</div>
            <div class="inv-num">${esc(inv.num)}</div>
          </div>
          <span class="badge badge-${status}">${status.charAt(0).toUpperCase()+status.slice(1)}</span>
        </div>
        <div class="card-div"></div>
        <div class="card-meta">
          <div class="req">
            <div class="av" style="background:${color}">${ini}</div>
            <span class="req-name">${esc(inv.requester)}</span>
          </div>
          <span class="amt">${fmtAmt(inv.amt)}</span>
        </div>
        ${actions}`;
      el.appendChild(card);
    });
  }

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  function tick() {
    document.getElementById('ts').textContent =
      new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  tick();
  render();
</script>
</body>
</html>
