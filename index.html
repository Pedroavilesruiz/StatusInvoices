<script>
const SUPABASE_URL = "https://pbjdlqekdjwwzzqsqwur.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_ANON_KEY_HERE";

/* =========================
   TAB SWITCH
========================= */
function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

/* =========================
   LOAD FROM SUPABASE
========================= */
async function loadInvoices() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/invoices?select=*`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  });

  const data = await res.json();
  render(data);
}

/* =========================
   MAIN RENDER ENGINE
========================= */
function render(invoices) {
  const groups = {
    pending: [],
    approved: [],
    rejected: []
  };

  invoices.forEach(inv => {
    const s = inv.status || "pending";
    if (!groups[s]) groups[s] = [];
    groups[s].push(inv);
  });

  renderColumn("pending", groups.pending);
  renderColumn("approved", groups.approved);
  renderColumn("rejected", groups.rejected);

  // COUNTERS
  document.getElementById('cnt-pending').textContent = groups.pending.length;
  document.getElementById('cnt-approved').textContent = groups.approved.length;
  document.getElementById('cnt-rejected').textContent = groups.rejected.length;
  document.getElementById('sum-total').textContent =
    invoices.length;

  document.getElementById('pending-notif').textContent =
    groups.pending.length;

  document.getElementById('ts').textContent =
    new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

/* =========================
   RENDER EACH COLUMN
========================= */
function renderColumn(status, items) {
  const el = document.getElementById('cards-' + status);

  if (!items || items.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div>No invoices</div>
      </div>
    `;
    return;
  }

  el.innerHTML = items.map(inv => {
    const badge = status;

    return `
      <div class="card">

        <div class="card-top">
          <div>
            <div class="inv-name">${inv.name || "Untitled"}</div>
            <div class="inv-num">${inv.num || ""}</div>
          </div>

          <span class="badge badge-${badge}">
            ${badge.toUpperCase()}
          </span>
        </div>

        <div class="card-div"></div>

        <div class="card-meta">
          <div class="req">
            <div class="av">${(inv.name || "X")[0]}</div>
            <span class="req-name">User</span>
          </div>

          <span class="amt">€${inv.amount || 0}</span>
        </div>

        <div class="card-actions">
          ${status !== 'approved' ? `
            <button class="action-btn btn-approve"
              onclick="updateStatus(${inv.id}, 'approved')">
              Approve
            </button>` : ''}

          ${status !== 'rejected' ? `
            <button class="action-btn btn-reject"
              onclick="updateStatus(${inv.id}, 'rejected')">
              Reject
            </button>` : ''}

          ${status !== 'pending' ? `
            <button class="action-btn btn-undo"
              onclick="updateStatus(${inv.id}, 'pending')">
              Move
            </button>` : ''}
        </div>

      </div>
    `;
  }).join('');
}

/* =========================
   CREATE INVOICE (SUPABASE)
========================= */
async function submitEntry() {
  const name = document.getElementById('f-name').value;
  const num = document.getElementById('f-num').value;
  const amt = document.getElementById('f-amt').value;

  if (!name || !num || !amt) return;

  await fetch(`${SUPABASE_URL}/rest/v1/invoices`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      name,
      num,
      amount: parseFloat(amt),
      status: 'pending'
    })
  });

  document.getElementById('f-name').value = '';
  document.getElementById('f-num').value = '';
  document.getElementById('f-amt').value = '';

  loadInvoices();
}

/* =========================
   UPDATE STATUS (SUPABASE)
========================= */
async function updateStatus(id, status) {
  await fetch(`${SUPABASE_URL}/rest/v1/invoices?id=eq.${id}`, {
    method: 'PATCH',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ status })
  });

  loadInvoices();
}

/* =========================
   INIT
========================= */
loadInvoices();
</script>
